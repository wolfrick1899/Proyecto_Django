
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Mi página Django</title>

    <style>
        body {
            margin: 0;
            background-color: #081521;
            color: white;
            font-family: Arial;
        }

        nav {
            padding: 25px 60px;
            background-color: #101f2d;
            display: flex;
            justify-content: space-between;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
        }

        .principal {
            text-align: center;
            padding: 100px 20px;
        }

        h1 {
            font-size: 45px;
            color: #00d6c3;
        }

        p {
            color: #bdc8d3;
            font-size: 18px;
        }

        button {
            background-color: #00cbb8;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
        }

        footer {
            text-align: center;
            padding: 25px;
            background-color: #101f2d;
        }
    </style>

</head>

<body>

    <nav>
        <h2>Django</h2>

        <div>
            <a href="#">Inicio</a>
            <a href="#">Acerca de</a>
            <a href="#">Servicios</a>
            <a href="#">Contacto</a>
        </div>
    </nav>

    <div class="principal">

        <h1>Bienvenido a Django</h1>

        <p>Construye cosas increíbles con Python.</p>

        <p>Aprende a desarrollar aplicaciones web modernas.</p>

        <button>Comenzar</button>

    </div>

    <footer>
        Hecho con ❤️ por Mike | Django
    </footer>

</body>
</html>

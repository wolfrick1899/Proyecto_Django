<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Lista de estudiantes</title>
</head>

<body>

    <h1>Lista de estudiantes</h1>

    <table border="1">

        <tr>
            <th>Documento</th>
            <th>Nombre</th>
            <th>Apellido</th>
            <th>Edad</th>
        </tr>

        {% for estudiante in estudiantes %}

        <tr>
            <td>{{ estudiante.documento }}</td>
            <td>{{ estudiante.nombre }}</td>
            <td>{{ estudiante.apellido }}</td>
            <td>{{ estudiante.edad }}</td>
        </tr>

        {% endfor %}

    </table>

</body>
</html>
